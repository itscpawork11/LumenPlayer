name: Lumen Player CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore VlcRebuild.sln

      - name: Build
        run: dotnet build VlcRebuild.sln -c Debug --no-restore

      - name: Test
        run: dotnet test VlcRebuild.sln -c Debug --no-build
